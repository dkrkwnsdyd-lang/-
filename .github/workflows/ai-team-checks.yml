name: AI Team checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run the full local test suite (may take time)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: Offline smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHORTSMAKER_PROBE_CREDENTIALS: '0'
      MOSS_API_KEY: ''
      GEMINI_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8' 'httpx>=0.27'
      - name: Syntax check
        run: python -m compileall -q shortsmaker
      - name: Run offline regression smoke
        run: |
          python -m pytest -q tests/test_sources.py tests/test_platforms.py tests/test_moss_image.py tests/test_hypit_bridge.py tests/test_preview_review.py

  full-suite:
    name: Full local pytest
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_suite) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHORTSMAKER_PROBE_CREDENTIALS: '0'
      MOSS_API_KEY: ''
      GEMINI_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8' 'httpx>=0.27'
      - name: Run full offline suite
        run: python -m pytest -q

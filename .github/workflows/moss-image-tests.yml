name: MOSS Image opt-in tests
on:
  push:
    branches:
      - feature/moss-image-optin-20261021
  pull_request:
    paths:
      - 'shortsmaker/studio/moss_image.py'
      - 'shortsmaker/web/moss_api.py'
      - 'shortsmaker/web/static/moss.html'
      - 'shortsmaker/web/app.py'
      - 'shortsmaker/cli.py'
      - 'tests/test_moss_image.py'
      - '.github/workflows/moss-image-tests.yml'
jobs:
  offline-moss-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8' 'httpx>=0.27'
      - name: Run tests without MOSI key or external generation
        env:
          MOSS_API_KEY: ''
        run: python -m pytest tests/test_moss_image.py tests/test_hypit_bridge.py -q

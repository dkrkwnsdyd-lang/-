final_qa_thresholds:
  hook: 80
  visual_quality: 85
  product_consistency: 90
  story: 80
  pacing: 80
  caption: 80
  audio: 70
  ai_artifact: 85
  cta: 80
  overall: 85
first_3_seconds:           # 기본 참고 패턴 (초)
  motion_at: 0.0
  first_caption: [0.3, 0.7]
  first_visual_change: [0.8, 1.3]
  tension_build: [1.5, 2.2]
  reveal: [2.0, 4.0]
pacing:
  avg_shot_length: [0.9, 2.6]
  max_shot_length: 3.6
  min_shot_length: 0.45
visual_qa_fail:            # 하나라도 있으면 FAIL
  - extra_fingers
  - warped_product
  - duplicated_product
  - changed_logo
  - face_collapse
  - broken_text
  - floating_object
  - wrong_proportion
  - wrong_color
  - wrong_button_position
source_image:
  min_short_side: 480
  min_sharpness: 40        # 라플라시안 분산 근사치
  exposure: [35, 225]      # 평균 밝기 허용 범위

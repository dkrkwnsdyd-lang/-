# 플랫폼 규칙이 바뀌면 이 파일만 수정한다.
master_safe_zone:            # 모든 플랫폼의 교집합 (1080x1920 기준 비율)
  top: 0.12
  bottom: 0.22
  left: 0.06
  right: 0.14
profiles:
  youtube:
    label: 유튜브 쇼츠
    aspect_ratio: "9:16"
    duration_preference: [15, 35]
    max_duration: 180
    safe_zone: {top: 0.10, bottom: 0.20, left: 0.05, right: 0.12}
    caption_position: upper_third
    hook_style: "궁금증/반전"
    cta_style: "고정 댓글/설명란 링크 확인"
    cta_text: "링크는 고정댓글에"
    description_style: "첫 줄 요약 + 제품 정보 + 고지"
    hashtag_style: {count: [2, 4], always: ["Shorts"]}
    thumbnail_rule: "첫 프레임이 곧 썸네일 - 제품/후킹 텍스트 포함"
    audio_rule: {loudness_lufs: -14}
    export_preset: {crf: 18, maxrate: 12M, audio_bitrate: 192k}
  instagram:
    label: 인스타 릴스
    aspect_ratio: "9:16"
    duration_preference: [12, 30]
    max_duration: 180
    safe_zone: {top: 0.12, bottom: 0.22, left: 0.06, right: 0.14}
    caption_position: upper_third
    hook_style: "감성/발견"
    cta_style: "저장/프로필 링크"
    cta_text: "저장해두고 프로필 링크에서"
    description_style: "짧은 한 줄 + 줄바꿈 + 해시태그"
    hashtag_style: {count: [3, 5], always: []}
    thumbnail_rule: "커버 프레임 선택 가능 - 제품 히어로샷"
    audio_rule: {loudness_lufs: -14}
    export_preset: {crf: 19, maxrate: 8M, audio_bitrate: 128k}
  tiktok:
    label: 틱톡
    aspect_ratio: "9:16"
    duration_preference: [12, 25]
    max_duration: 600
    safe_zone: {top: 0.12, bottom: 0.22, left: 0.06, right: 0.14}
    caption_position: upper_third
    hook_style: "빠른 전개/대화체"
    cta_style: "프로필 링크/댓글"
    cta_text: "궁금하면 프로필 링크"
    description_style: "짧고 캐주얼"
    hashtag_style: {count: [3, 5], always: []}
    thumbnail_rule: "첫 프레임 강한 움직임"
    audio_rule: {loudness_lufs: -14}
    export_preset: {crf: 19, maxrate: 10M, audio_bitrate: 128k}
  threads:
    label: 쓰레드
    aspect_ratio: "9:16"
    duration_preference: [10, 30]
    max_duration: 300
    safe_zone: {top: 0.08, bottom: 0.12, left: 0.05, right: 0.05}
    caption_position: upper_third
    hook_style: "대화/의견"
    cta_style: "댓글 대화 유도"
    cta_text: "써본 분 의견 궁금해요"
    description_style: "대화체 2~3문장, 500자 이내"
    hashtag_style: {count: [0, 1], always: []}
    thumbnail_rule: "자동"
    audio_rule: {loudness_lufs: -14}
    export_preset: {crf: 20, maxrate: 8M, audio_bitrate: 128k}
